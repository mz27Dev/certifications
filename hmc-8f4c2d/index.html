<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">

  <title>HMC Certification</title>

  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      background: #525659;
      color: #252525;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: flex;
    }

    .certificate-viewer {
      width: calc(100% - 32px);
      max-width: 1182px;
      margin: auto;
    }

    .certificate {
      margin: 0;
      background: #fff;
    }

    .certificate-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .placeholder {
      aspect-ratio: 1182 / 816;
      padding: 24px;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 12px;
      text-align: center;
    }

    .placeholder h1 {
      margin: 0;
      color: #075b91;
      font-size: clamp(18px, 2.5vw, 28px);
      font-weight: 400;
    }

    .placeholder p {
      max-width: 32ch;
      margin: 0;
      color: #62676b;
      font-size: clamp(13px, 1.5vw, 16px);
      line-height: 1.5;
    }

    [hidden] {
      display: none !important;
    }

    @page {
      size: A4 landscape;
      margin: 10mm;
    }

    @media print {
      :root,
      body {
        background: #fff;
      }

      body {
        min-height: 0;
        display: block;
      }

      .certificate-viewer {
        width: 100%;
        max-width: none;
      }

      .certificate-image {
        max-height: 190mm;
        object-fit: contain;
      }
    }
  </style>
</head>

<body>
  <main class="certificate-viewer" aria-label="HMC certification">
    <figure class="certificate">
      <img
        class="certificate-image"
        id="certificate-image"
        src="./certificate.png"
        width="1182"
        height="816"
        alt="HMC certificate for Mohamed M. Zena"
        hidden
      >

      <div class="placeholder" id="certificate-placeholder">
        <h1>HMC Certification</h1>
        <p>The certificate image has not been added yet.</p>
      </div>
    </figure>
  </main>

  <script>
    const certificateImage =
      document.getElementById("certificate-image");

    const certificatePlaceholder =
      document.getElementById("certificate-placeholder");

    function updateCertificate() {
      const isLoaded =
        certificateImage.complete &&
        certificateImage.naturalWidth > 0;

      certificateImage.hidden = !isLoaded;
      certificatePlaceholder.hidden = isLoaded;
    }

    certificateImage.addEventListener("load", updateCertificate);
    certificateImage.addEventListener("error", updateCertificate);

    updateCertificate();
  </script>

  <noscript>
    <style>
      #certificate-image[hidden] {
        display: block !important;
      }

      #certificate-placeholder {
        display: none;
      }
    </style>
  </noscript>
</body>
</html>
